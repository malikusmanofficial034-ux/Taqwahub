name: Build and Sign Android Release

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # Allows manual trigger from GitHub UI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  RELEASE_KEY_ALIAS: "xfuturestudiotaqwahubapp"

jobs:
  build:
    name: Build Signed APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'

      - name: Decode Keystore File
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > my-upload-key.jks

      - name: Print Keystore SHA-1
        run: |
          keytool -list -v -keystore my-upload-key.jks -alias ${{ env.RELEASE_KEY_ALIAS }} -storepass ${{ secrets.RELEASE_STORE_PASSWORD }} -keypass ${{ secrets.RELEASE_KEY_PASSWORD }} | grep SHA1

      - name: Build Signed Release APK and Bundled AAB
        run: gradle :app:assembleRelease :app:bundleRelease --stacktrace
        env:
          RELEASE_STORE_FILE: ../my-upload-key.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ env.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Taqwahub-Signed-Release-APK
          path: app/build/outputs/apk/release/app-release.apk

      - name: Upload Signed Release AAB (App Bundle)
        uses: actions/upload-artifact@v4
        with:
          name: Taqwahub-Signed-Release-AAB
          path: app/build/outputs/bundle/release/app-release.aab
